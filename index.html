<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Bank Contacts</title>
  <link rel="manifest" href="manifest.json">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
</head>
<body>
  <h1>Bank Contact Directory</h1>

  <!-- Search -->
  <input id="search" placeholder="Search by bank, official, phone, or email" />

  <!-- New Contact Form -->
  <h2>Add New Contact</h2>
  <form id="contactForm">
    <input type="text" id="bankName" placeholder="Bank Name" required />
    <input type="text" id="officialName" placeholder="Official Name" required />
    <input type="text" id="contactNumber" placeholder="Contact Number" required />
    <input type="email" id="email" placeholder="Email" required />
    <button type="submit">Add Contact</button>
  </form>

  <!-- Results Table -->
  <div id="results"></div>

  <script src="app.js"></script>
</body>
</html>
